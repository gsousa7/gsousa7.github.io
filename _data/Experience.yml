subject: Experiences
listing-order: 2
icon: "/assets/img/briefcase.svg"
contents:
- title: Richemont
  url: "https://www.richemont.com/"
  role: DevOps Engineer
  description:
  - Implemented end-to-end observability for Kubernetes workloads with OpenTelemetry, and built Datadog dashboards to monitor platform health, application performance, and key business metrics across manufacturing environments
  - Managed and maintained JFrog Artifactory as the central artifact repository, ensuring reliable storage and distribution across CI/CD pipelines
  - Managed and supported platforms across all Maisons running our platform, ensuring availability, compliance, and alignment with each Maison's operational requirements
  - Owned incident management end-to-end via Datadog — from detection and triage through escalation to internal teams or external vendors, and stakeholder communication through to resolution
  - Participated in Root Cause Analysis and Post-Mortem processes, documenting findings and driving corrective actions to improve platform reliability
  - Tracked tasks and incidents across JIRA, ServiceNow, and Confluence, keeping technical documentation current
  - Actively contributed to architectural reviews and design decisions through Agile ceremonies, driving continuous improvement across industrial manufacturing platforms
  date: Mar. 2026 — Present
- title: AXA Group Operations
  url: "https://www.axa.com/"
  role: DevOps Engineer
  description:
  - Provided Azure platform support across PaaS and IaaS, deploying and managing resources with Terraform (Terraform Enterprise) and ARM templates via Azure DevOps
  - Managed and troubleshot Windows Server and Linux virtual machines, including a High-Performance Computing cluster (HPC Pack)
  - Automated operational processes with Bash and PowerShell, integrated into Azure DevOps pipelines
  - Reviewed Microsoft Defender for Cloud findings and implemented remediations aligned with architecture and security policy
  - Handled product support (changes, incidents, requests) through JIRA and ServiceNow, keeping technical documentation current in Confluence
  - Collaborated across Developers and L3 teams to troubleshoot and deliver specific requirements
  - Onboarded newcomers to customer infrastructure, procedures, and ticket management through hands-on knowledge transfer
  date: Sep. 2024 — Feb. 2026
- title: Timestamp
  url: "https://www.timestampgroup.com/en"
  role: Cloud Engineer
  description:
  - Provided Azure platform support across PaaS and IaaS, managing Windows Server and Linux virtual machines and a High-Performance Computing cluster (HPC Pack)
  - Reviewed Microsoft Defender for Cloud findings and implemented remediations aligned with architecture and security policy
  - Automated operational processes with Bash scripting
  - Handled customer support (changes, incidents, requests) across Azure DevOps, Jira, and ServiceNow, keeping technical documentation current in Confluence
  - Collaborated across Developers, L3, and Systems teams to troubleshoot and deliver specific requirements
  - Guided newcomers through customer infrastructure, procedures, and ticket management via structured knowledge transfer
  date: Apr. 2022 — Sep. 2024
- title: Timestamp
  url: "https://www.timestampgroup.com/en"
  role: Linux System Administrator
  description:
  - Deployed, configured, and maintained physical and virtual infrastructure (Dell/HP/Oracle servers, Oracle Engineered Systems, Oracle Virtual Manager, Oracle Linux Virtualization Manager) across RHEL and Debian environments
  - Implemented backup and monitoring solutions using BareOS, EMC NetWorker, Oracle Secure Backup, CheckMK, Nagios, and Oracle Enterprise Manager
  - Automated infrastructure processes with Ansible and Bash scripting
  - Managed storage (LVM, NFS, Oracle ZFS Appliance), networking (firewalld, iptables), and containerization (Docker Compose)
  - Configured and maintained web services and print management with Apache HTTP Server, NGINX, and CUPS
  - Handled customer support (changes, incidents, requests) across Redmine, ServiceNow, and iTop, collaborating with Database, Middleware, and Big Data teams, and keeping documentation current in Microsoft OneNote
  - Provided 24/7 on-call support
  - Trained newcomers on customer infrastructure, procedures, and ticket handling through structured knowledge transfer
  date: Sep. 2018 — Apr. 2022
